<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>COSMOS GENESIS — 宇宙大爆炸与时空演化演示 (Stage 2 Standalone)</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body {
        width: 100%; height: 100%; overflow: hidden;
        background: #03050c; color: #f1f5f9;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
        user-select: none;
      }
      #canvas-wrap { position: fixed; inset: 0; cursor: grab; }
      #canvas-wrap:active { cursor: grabbing; }
      .hud {
        position: fixed; inset: 0; z-index: 10; pointer-events: none;
        display: flex; flex-direction: column; justify-content: space-between;
        padding: 16px;
      }
      .card {
        pointer-events: auto;
        background: rgba(7, 11, 21, 0.88);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 12px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      }
      .info-card { max-width: 500px; padding: 14px 16px; }
      .row-between { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
      .brand { font-size: 12px; font-weight: 600; letter-spacing: 0.08em; color: #7dd3fc; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-variant-numeric: tabular-nums; }
      .title { font-size: 18px; font-weight: 600; margin-top: 4px; color: #f8fafc; }
      .subtitle { font-size: 12px; color: #94a3b8; margin-top: 2px; }
      .metrics {
        display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px;
        margin-top: 10px; padding: 8px 0;
        border-top: 1px solid rgba(255,255,255,0.1); border-bottom: 1px solid rgba(255,255,255,0.1);
      }
      .metric-label { font-size: 11px; color: #94a3b8; }
      .metric-val { font-size: 12px; font-weight: 500; margin-top: 2px; white-space: nowrap; }
      .summary { font-size: 12.5px; line-height: 1.55; color: #cbd5e1; margin-top: 8px; }
      .approx { font-size: 11px; line-height: 1.45; color: #94a3b8; margin-top: 4px; }
      .dock-wrap { display: flex; flex-direction: column; align-items: center; width: 100%; }
      .dock { width: 100%; max-width: 940px; padding: 12px 16px; display: flex; flex-direction: column; gap: 10px; }
      .anchors { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; }
      button {
        cursor: pointer; border: 1px solid rgba(255,255,255,0.1);
        background: rgba(255,255,255,0.04); color: #cbd5e1;
        border-radius: 8px; padding: 7px 8px; font-size: 12px; font-weight: 500;
        transition: background 0.15s, border-color 0.15s, color 0.15s;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }
      button:hover { background: rgba(255,255,255,0.1); color: #fff; }
      button.active { background: rgba(56, 189, 248, 0.2); border-color: rgba(56, 189, 248, 0.6); color: #e0f2fe; }
      button.primary { background: #38bdf8; border-color: #38bdf8; color: #020617; font-weight: 600; padding: 7px 14px; }
      button.primary:hover { background: #7dd3fc; }
      .slider-row { display: flex; align-items: center; gap: 12px; font-size: 12px; color: #94a3b8; }
      input[type="range"] { flex: 1; accent-color: #38bdf8; cursor: pointer; }
      .controls-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }
      .btn-group { display: flex; align-items: center; gap: 8px; }
      @media (max-width: 640px) {
        .metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .anchors { grid-template-columns: repeat(3, minmax(0, 1fr)); }
        .approx { display: none; }
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.174.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.174.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <div id="canvas-wrap"></div>
    <div class="hud">
      <header class="card info-card">
        <div class="row-between">
          <span class="brand">COSMOS GENESIS</span>
          <span class="mono" style="font-size:12px;color:#94a3b8" id="hud-step">纪元 01 / 06</span>
        </div>
        <h1 class="title" id="hud-title">量子涨落与极早期高能态</h1>
        <p class="subtitle" id="hud-en">Quantum Fluctuations &amp; Planck Era</p>
        <div class="metrics">
          <div><div class="metric-label">物理时间</div><div class="metric-val mono" id="hud-time">t ≈ 10^-43 s</div></div>
          <div><div class="metric-label">估算温度</div><div class="metric-val mono" style="color:#fcd34d" id="hud-temp">T ≈ 10^32 K</div></div>
          <div><div class="metric-label">宇宙红移</div><div class="metric-val mono" style="color:#a5b4fc" id="hud-z">z ≫ 10⁹</div></div>
          <div><div class="metric-label">尺度倍率</div><div class="metric-val mono" style="color:#7dd3fc" id="hud-scale">a ≈ 0.18</div></div>
        </div>
        <p class="summary" id="hud-summary"></p>
        <p class="approx" id="hud-approx"></p>
      </header>

      <div class="dock-wrap">
        <section class="card dock">
          <div class="anchors" id="epoch-anchors"></div>
          <div class="slider-row">
            <span>演化进度</span>
            <input type="range" id="timeline-slider" min="0" max="1" step="0.001" value="0" />
            <span class="mono" id="hud-pct" style="width:48px;text-align:right;color:#e2e8f0">0.0%</span>
          </div>
          <div class="controls-row">
            <div class="btn-group">
              <button class="primary" id="btn-play">暂停演化</button>
              <button id="btn-reset">重置演化</button>
            </div>
            <div class="btn-group">
              <button class="active" id="btn-grid">共动网格</button>
              <span style="font-size:11px;color:#94a3b8">拖拽环视 · 滚轮缩放</span>
            </div>
          </div>
        </section>
      </div>
    </div>

    <script type="module">
      import * as THREE from 'three';
      import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
      import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
      import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
      import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
      import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

      const EPOCHS = [
        { id: 1, short: '01 量子涨落', title: '量子涨落与极早期高能态', en: 'Quantum Fluctuations & Planck Era', range: [0.0, 0.12], anchor: 0.05, bloom: 1.5, summary: '时空曲率与能量密度达到普朗克与大统一能标，真空零点涨落在微观尺度剧烈起伏。', approx: '视觉近似：以高频三维随机位移场近似量子泡沫涨落。' },
        { id: 2, short: '02 暴胀种子', title: '指数级暴胀与密度种子', en: 'Cosmic Inflation & Primordial Seeds', range: [0.12, 0.26], anchor: 0.19, bloom: 1.35, summary: '暴胀子场驱动空间度规呈指数级拉伸，将微观量子涨落冻结为原初密度扰动种子。', approx: '视觉近似：将 e⁶⁰ 倍暴胀压缩为平滑对数膨胀并配合共动晶格拉伸。' },
        { id: 3, short: '03 太初炽雾', title: '夸克汤 / 太初核合成炽热雾', en: 'Quark-Gluon Plasma & BBN', range: [0.26, 0.44], anchor: 0.35, bloom: 1.2, summary: '强子化形成质子与中子并合成轻元素，光子被自由电子频繁散射形成炽热等离子体雾。', approx: '视觉近似：以光学厚炽热金橙色粒子雾近似光子-重子耦合流体。' },
        { id: 4, short: '04 复合CMB', title: '38 万年复合与 CMB 光子释放', en: 'Recombination & CMB Decoupling', range: [0.44, 0.62], anchor: 0.53, bloom: 0.85, summary: '宇宙冷却至约 3000 K，中性氢形成，光子退耦自由穿行并留下 CMB 最后散射面印记。', approx: '视觉近似：放大十万分之一量级 CMB 温度起伏对比度并以红暖/蓝冷伪彩呈现。' },
        { id: 5, short: '05 第一代星', title: '黑暗时代与第一代恒星点亮', en: 'Dark Ages & Cosmic Dawn (Pop III)', range: [0.62, 0.8], anchor: 0.71, bloom: 1.0, summary: '背景辐射红移进入黑暗时代；重子气体沿暗物质势阱坍缩并点燃第一代恒星。', approx: '视觉近似：以暗紫色势阱丝带标示不可见暗物质引导的坍缩路径。' },
        { id: 6, short: '06 宇宙网', title: '宇宙网、星系团与暗能量加速膨胀', en: 'Cosmic Web & Dark Energy Acceleration', range: [0.8, 1.0], anchor: 0.9, bloom: 0.92, summary: '星系团内部退耦停止膨胀，团际空洞在暗能量主导下呈现加速扩张。', approx: '视觉近似：以程序化纤维节点场近似 N 体引力坍缩结构。' },
      ];

      const isMobile = window.innerWidth < 768 || (navigator.maxTouchPoints > 0 && window.innerWidth < 1024);
      const PARTICLE_COUNT = isMobile ? 7000 : 20000;
      const clamp01 = (v) => Math.max(0, Math.min(1, v));
      const lerp = (a, b, t) => a + (b - a) * t;
      const smoothstep = (e0, e1, x) => { const t = clamp01((x - e0) / (e1 - e0)); return t * t * (3 - 2 * t); };

      function getEpochWeights(p) {
        const w = [0,0,0,0,0,0];
        let s = 0;
        for (let i = 0; i < 6; i++) {
          const [a, b] = EPOCHS[i].range;
          const enter = i === 0 ? 1 : smoothstep(a - 0.035, a + 0.035, p);
          const exit = i === 5 ? 1 : 1 - smoothstep(b - 0.035, b + 0.035, p);
          w[i] = Math.max(0, enter * exit);
          s += w[i];
        }
        return s > 1e-6 ? w.map((v) => v / s) : [1,0,0,0,0,0];
      }

      const wrap = document.getElementById('canvas-wrap');
      const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.12;
      wrap.appendChild(renderer.domElement);

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x03050c);
      scene.fog = new THREE.FogExp2(0x03050c, 0.011);

      const camera = new THREE.PerspectiveCamera(56, window.innerWidth / window.innerHeight, 0.1, 220);
      camera.position.set(0, 5.2, 22.5);

      const controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.06;
      controls.enablePan = false;
      controls.minDistance = 4.5;
      controls.maxDistance = 68;

      const composer = new EffectComposer(renderer);
      composer.addPass(new RenderPass(scene, camera));
      const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.15, 0.48, 0.22);
      composer.addPass(bloomPass);
      composer.addPass(new OutputPass());

      let seed = 138002026;
      const rng = () => { seed += 0x6d2b79f5; let t = seed; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
      const unitSphere = () => { const u = rng(), v = rng(), th = 2 * Math.PI * u, ph = Math.acos(2 * v - 1); return [Math.sin(ph) * Math.cos(th), Math.sin(ph) * Math.sin(th), Math.cos(ph)]; };

      const nodes = Array.from({ length: 22 }, () => { const [x,y,z] = unitSphere(); const r = 4.5 + Math.pow(rng(), 0.7) * 14.5; return [x*r, y*r*0.78, z*r]; });
      const filaments = [];
      for (let a = 0; a < 22; a++) {
        const d = nodes.map((n, b) => ({ b, dist: a === b ? 1e9 : Math.hypot(nodes[a][0]-n[0], nodes[a][1]-n[1], nodes[a][2]-n[2]) })).sort((u,v) => u.dist - v.dist);
        for (let k = 0; k < 2; k++) if (a < d[k].b) filaments.push([a, d[k].b]);
      }

      const pos = new Float32Array(PARTICLE_COUNT * 3);
      const col = new Float32Array(PARTICLE_COUNT * 3);
      const sizes = new Float32Array(PARTICLE_COUNT);
      const phases = new Float32Array(PARTICLE_COUNT);
      const epPos = Array.from({ length: 6 }, () => new Float32Array(PARTICLE_COUNT * 3));
      const epCol = Array.from({ length: 6 }, () => new Float32Array(PARTICLE_COUNT * 3));

      for (let i = 0; i < PARTICLE_COUNT; i++) {
        const i3 = i * 3;
        const [ux, uy, uz] = unitSphere();
        const cr = Math.cbrt(rng());
        phases[i] = rng() * Math.PI * 2;
        sizes[i] = 0.65 + Math.pow(rng(), 2.2) * 2.1;

        const r1 = 0.25 + Math.pow(cr, 1.35) * 1.95;
        epPos[0].set([ux*r1, uy*r1, uz*r1], i3);
        epCol[0].set([0.92, 0.9, 1.0], i3);

        const r2 = (1.5 + cr * 7.8) * (1 + 0.14 * Math.sin(ux*6 + uy*5) * Math.cos(uz*6));
        epPos[1].set([ux*r2, uy*r2*0.92, uz*r2], i3);
        epCol[1].set([0.65, 0.88, 1.0], i3);

        const r3 = (1.8 + cr * 10.6) * (1 + 0.12 * Math.sin(cr * Math.PI * 5));
        epPos[2].set([ux*r3, uy*r3*0.92, uz*r3], i3);
        epCol[2].set([0.98, 0.56, 0.18], i3);

        const r4 = i % 3 === 0 ? 13.5 + (rng()-0.5)*1.4 : 2.2 + cr * 12.2;
        epPos[3].set([ux*r4, uy*r4*0.94, uz*r4], i3);
        const aniso = clamp01(0.5 + 0.34 * (Math.sin(ux*3.4+0.5)*Math.cos(uy*3.1) + 0.65*Math.sin(uz*5.2-ux*2.7)));
        epCol[3].set([lerp(0.12,0.98,aniso), lerp(0.45,0.58,aniso), lerp(0.95,0.16,aniso)], i3);

        const [na, nb] = filaments[i % filaments.length];
        const te = rng();
        const [jx, jy, jz] = unitSphere();
        const js = 1.15 + rng() * 1.9;
        epPos[4].set([lerp(nodes[na][0], nodes[nb][0], te)*0.86 + jx*js, lerp(nodes[na][1], nodes[nb][1], te)*0.86 + jy*js, lerp(nodes[na][2], nodes[nb][2], te)*0.86 + jz*js], i3);
        const pop3 = rng() > 0.86;
        epCol[4].set(pop3 ? [0.72, 0.88, 1.0] : [0.2, 0.16, 0.44], i3);

        const nIdx = i % 22;
        const [sx, sy, sz] = unitSphere();
        const role = rng();
        if (role < 0.42) {
          const cr6 = Math.pow(rng(), 1.8) * 1.45;
          epPos[5].set([nodes[nIdx][0]*1.18 + sx*cr6, nodes[nIdx][1]*1.18 + sy*cr6, nodes[nIdx][2]*1.18 + sz*cr6], i3);
          epCol[5].set([0.85, 0.9, 1.0], i3);
        } else {
          const tr = Math.pow(rng(), 1.4) * 0.85;
          epPos[5].set([lerp(nodes[na][0], nodes[nb][0], te)*1.18 + sx*tr, lerp(nodes[na][1], nodes[nb][1], te)*1.18 + sy*tr, lerp(nodes[na][2], nodes[nb][2], te)*1.18 + sz*tr], i3);
          epCol[5].set([0.34, 0.44, 0.85], i3);
        }
      }

      const geo = new THREE.BufferGeometry();
      const posAttr = new THREE.BufferAttribute(pos, 3); posAttr.setUsage(THREE.DynamicDrawUsage);
      const colAttr = new THREE.BufferAttribute(col, 3); colAttr.setUsage(THREE.DynamicDrawUsage);
      geo.setAttribute('position', posAttr);
      geo.setAttribute('aColor', colAttr);
      geo.setAttribute('aSize', new THREE.BufferAttribute(sizes, 1));
      geo.setAttribute('aPhase', new THREE.BufferAttribute(phases, 1));

      const mat = new THREE.ShaderMaterial({
        uniforms: { uTime: { value: 0 }, uProgress: { value: 0 }, uPixelRatio: { value: renderer.getPixelRatio() } },
        vertexShader: `
          attribute vec3 aColor; attribute float aSize; attribute float aPhase;
          uniform float uTime; uniform float uProgress; uniform float uPixelRatio;
          varying vec3 vColor; varying float vAlpha;
          // === [STAGE 3: EPOCH SHADERS & TRANSITIONS] ===
          void main() {
            vColor = aColor;
            float shimmer = 0.03 + 0.14 * (1.0 - smoothstep(0.0, 0.35, uProgress));
            vec3 p = position + vec3(sin(uTime*1.9+aPhase), cos(uTime*1.6+aPhase*1.3), sin(uTime*1.4+aPhase*0.7)) * shimmer;
            vec4 mv = modelViewMatrix * vec4(p, 1.0);
            float dist = max(1.5, -mv.z);
            gl_PointSize = clamp((aSize * 38.0 * uPixelRatio) / dist, 1.4, 24.0);
            vAlpha = smoothstep(110.0, 12.0, dist);
            gl_Position = projectionMatrix * mv;
          }
        `,
        fragmentShader: `
          varying vec3 vColor; varying float vAlpha;
          // === [STAGE 3: EPOCH SHADERS & TRANSITIONS] ===
          void main() {
            vec2 uv = gl_PointCoord - vec2(0.5);
            float r2 = dot(uv, uv); if (r2 > 0.25) discard;
            float a = (exp(-r2 * 15.0) + exp(-r2 * 48.0) * 0.65) * vAlpha;
            gl_FragColor = vec4(vColor, a);
          }
        `,
        transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
      });
      const points = new THREE.Points(geo, mat);
      points.frustumCulled = false;
      scene.add(points);

      const coreMat = new THREE.MeshBasicMaterial({ color: 0xfff7e6, transparent: true, opacity: 0.8, blending: THREE.AdditiveBlending, depthWrite: false });
      const coreMesh = new THREE.Mesh(new THREE.SphereGeometry(0.85, 24, 24), coreMat);
      scene.add(coreMesh);

      const gridCoords = [];
      for (let x = -12; x <= 12; x += 4) for (let y = -12; y <= 12; y += 4) gridCoords.push(x, y, -12, x, y, 12, x, -12, y, x, 12, y, -12, x, y, 12, x, y);
      const gridGeo = new THREE.BufferGeometry();
      gridGeo.setAttribute('position', new THREE.Float32BufferAttribute(gridCoords, 3));
      const gridMesh = new THREE.LineSegments(gridGeo, new THREE.LineBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.1, depthWrite: false }));
      scene.add(gridMesh);

      let progress = 0, isPlaying = true, showGrid = true, timeSec = 0, lastMs = performance.now();
      const slider = document.getElementById('timeline-slider');
      const anchorsWrap = document.getElementById('epoch-anchors');
      const anchorBtns = EPOCHS.map((ep) => {
        const b = document.createElement('button');
        b.textContent = ep.short;
        b.onclick = () => { progress = ep.anchor; updateHUD(); };
        anchorsWrap.appendChild(b);
        return b;
      });

      document.getElementById('btn-play').onclick = (e) => { isPlaying = !isPlaying; e.target.textContent = isPlaying ? '暂停演化' : '播放演化'; };
      document.getElementById('btn-reset').onclick = () => { progress = 0; isPlaying = true; document.getElementById('btn-play').textContent = '暂停演化'; updateHUD(); };
      document.getElementById('btn-grid').onclick = (e) => { showGrid = !showGrid; e.target.classList.toggle('active', showGrid); };
      slider.oninput = (e) => { progress = parseFloat(e.target.value); updateHUD(); };

      function updateHUD() {
        const ep = EPOCHS.find((e, i) => progress >= e.range[0] && (progress < e.range[1] || i === 5)) || EPOCHS[0];
        document.getElementById('hud-step').textContent = `纪元 0${ep.id} / 06`;
        document.getElementById('hud-title').textContent = ep.title;
        document.getElementById('hud-en').textContent = ep.en;
        document.getElementById('hud-summary').textContent = ep.summary;
        document.getElementById('hud-approx').textContent = ep.approx;
        document.getElementById('hud-pct').textContent = `${(progress * 100).toFixed(1)}%`;
        slider.value = String(progress);
        anchorBtns.forEach((b, i) => b.classList.toggle('active', EPOCHS[i].id === ep.id));
        const scale = 0.18 + 0.72 * smoothstep(0.1, 0.28, progress) + 0.55 * smoothstep(0.26, 0.62, progress) + 0.45 * smoothstep(0.62, 0.82, progress) + 0.58 * Math.pow(smoothstep(0.8, 1.0, progress), 1.35);
        document.getElementById('hud-scale').textContent = `a ≈ ${scale.toFixed(2)}`;
      }
      updateHUD();

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        composer.setSize(window.innerWidth, window.innerHeight);
      });

      function animate() {
        requestAnimationFrame(animate);
        const now = performance.now(), dt = Math.min(0.1, (now - lastMs) / 1000); lastMs = now; timeSec += dt;
        if (isPlaying) {
          progress = Math.min(1, progress + dt / 48);
          if (progress >= 1) { isPlaying = false; document.getElementById('btn-play').textContent = '播放演化'; }
          updateHUD();
        }
        const w = getEpochWeights(progress);
        for (let k = 0; k < PARTICLE_COUNT * 3; k++) {
          pos[k] = epPos[0][k]*w[0] + epPos[1][k]*w[1] + epPos[2][k]*w[2] + epPos[3][k]*w[3] + epPos[4][k]*w[4] + epPos[5][k]*w[5];
          col[k] = epCol[0][k]*w[0] + epCol[1][k]*w[1] + epCol[2][k]*w[2] + epCol[3][k]*w[3] + epCol[4][k]*w[4] + epCol[5][k]*w[5];
        }
        posAttr.needsUpdate = true; colAttr.needsUpdate = true;
        mat.uniforms.uTime.value = timeSec; mat.uniforms.uProgress.value = progress;
        const scale = 0.18 + 0.72 * smoothstep(0.1, 0.28, progress) + 0.55 * smoothstep(0.26, 0.62, progress) + 0.45 * smoothstep(0.62, 0.82, progress) + 0.58 * Math.pow(smoothstep(0.8, 1.0, progress), 1.35);
        gridMesh.visible = showGrid; gridMesh.scale.setScalar(scale * 1.15);
        const coreVis = 1 - smoothstep(0.26, 0.46, progress);
        coreMesh.visible = coreVis > 0.01; coreMat.opacity = 0.8 * coreVis;
        // === [STAGE 3: EPOCH SHADERS & TRANSITIONS] ===
        controls.update();
        composer.render();
      }
      animate();
    </script>
  </body>
</html>
